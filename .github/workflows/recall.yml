name: Recall

# The candidate index must return everything a full scan would, or the app
# reports fewer hits than the data supports — a silent false negative. This is
# the slow check (a full scan per query over the real snapshot), so it runs
# only when the scorer, the index or what they read has changed.
on:
  pull_request:
    paths:
      - "lib/matcher.js"
      - "lib/searchindex.js"
      - "lib/countries.js"
      - "lib/dates.js"
      - "lib/vocab.js"
      - "data/**"
      - "scripts/verify-recall.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fast path equals full scan
        run: npm run test:recall
