name: Refresh OFAC data

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 01:00 Stockholm (CEST); 00:00 in winter (CET)
    # Recovery pass. The coverage guard refuses to publish a snapshot that lost
    # an authority, so a few hours of upstream downtime — the EU list served
    # HTTP 500 for most of 2026-08-01 — froze every OTHER authority for a full
    # day as well. This run exits immediately when the published snapshot
    # already has full coverage (ONLY_IF_DEGRADED), so on a normal day it costs
    # seconds and commits nothing.
    - cron: '0 11 * * *'
  workflow_dispatch:        # manual run button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Exit codes:
      #   0  clean build, full authority coverage
      #   3  published, but an alarm is standing: an authority is still missing,
      #      or a measured field is below its floor. Both predate this build.
      #      The snapshot IS written and must be committed — the other data is
      #      fresh — so the failure is deferred to the last step, after commit.
      #   1  build failed, a source regressed since the last good snapshot, or a
      #      field regressed against the published one (a parser breaking looks
      #      exactly like that: same entity count, empty field). Nothing was
      #      written; the previous, more complete snapshot stands.
      - name: Build fresh snapshot from OFAC SLS
        id: build
        env:
          # The 11:00 pass exists only to recover a degraded snapshot; it stops
          # before fetching anything when coverage is already complete.
          ONLY_IF_DEGRADED: ${{ github.event.schedule == '0 11 * * *' && '1' || '' }}
        run: |
          set +e
          node scripts/build-cache.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Commit and push if changed
        run: |
          git config user.name "ofac-data-bot"
          git config user.email "actions@github.com"
          # The delta ships with the snapshot — a removal cannot be recovered
          # from the snapshot alone once the previous one is gone. The quality
          # profile ships too, because a field regression is only visible
          # against the numbers that were actually published.
          git add cache/snapshot.json.gz cache/changes.json cache/quality.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: refresh OFAC snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Runs last so the data still lands. A red run is the point: a screening
      # list that covers less than it claims is a false-negative source, and
      # nobody would otherwise notice it going quiet.
      - name: Fail if an alarm is standing
        if: steps.build.outputs.code == '3'
        run: |
          echo "::error::Snapshot published with a standing alarm — an authority is missing, or a measured field is below its floor. See the build log."
          exit 1
