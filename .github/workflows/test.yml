name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # Browser scripts are loaded by nothing the tests require, so a syntax
      # error there would pass every test and break a page.
      - name: Syntax-check every shipped script
        run: npm run check
      - name: Unit and HTTP tests
        run: npm test
      # The committed snapshot against the committed baseline: a parser change
      # that empties a field shows up here, before the nightly build trips on it.
      - name: Field-level quality of the bundled snapshot
        run: node scripts/quality-report.js

  # The things only a real page shows: hostile data rendered as markup, a
  # phone layout scrolling sideways, a theme toggle dying with storage blocked,
  # WCAG AA contrast. Playwright and axe-core are installed for this job only —
  # the app itself has no dependencies and a test browser should not add one.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install the test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:ui
