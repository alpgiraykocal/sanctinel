services:
  - type: web
    name: sanctinel
    runtime: node
    plan: free
    buildCommand: ""
    # Semi-space 8MB (V8 defaults to 16): measured ~15-20MB less resident
    # memory on this workload with no measurable change in search latency.
    startCommand: node --max-old-space-size=400 --max-semi-space-size=8 server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: "true"
      # Bundled snapshot is rebuilt daily by the GitHub Action; only fall back
      # to a runtime OFAC fetch if the bundled data is older than 26h.
      - key: CACHE_TTL_MS
        value: "93600000"
